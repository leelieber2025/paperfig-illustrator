name: test

on:
  push:
  pull_request:

jobs:
  npm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

# Optional tag release: after npm run pack, attach dist/paperfig-*.zip to a GitHub Release for the version tag.
